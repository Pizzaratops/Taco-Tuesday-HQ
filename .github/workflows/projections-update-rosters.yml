name: Projections – Update NBA Rosters

# Zieht 1x täglich die aktuellen Kader von ESPN (für die Projections-
# Seite / Minuten-Zuordnung) und committet Änderungen automatisch
# zurück ins Repo. Kann außerdem manuell angestoßen werden (Actions-Tab
# -> "Projections – Update NBA Rosters" -> "Run workflow").
#
# WICHTIG: Das ist ein separater ESPN-Rosterabruf als
# scripts/sync-espn-rosters.js im Hauptrepo (siehe daily-9cat.yml) —
# die Projections-Seite nutzt ihre eigene, unabhängige Datenstruktur
# (projections/data/rosters.json / rosters-data.js) für Team-Kader &
# Minuten-Zuordnung. Bewusst nicht zusammengelegt, um die Projections-
# Logik unverändert 1:1 zu übernehmen.
#
# Übernommen 1:1 aus dem eigenständigen MFHFBs-NBA-Projections-Repo,
# jetzt Unterordner projections/ in Taco Tuesday HQ.

on:
  schedule:
    # 09:00 UTC = 10/11 Uhr MEZ/MESZ — nach den meisten US-Nachtmeldungen,
    # vor dem europäischen Vormittag. Bei Bedarf einfach die Uhrzeit anpassen.
    - cron: "0 9 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: repo-write
  cancel-in-progress: false

jobs:
  update-rosters:
    runs-on: ubuntu-latest
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Roster von ESPN ziehen
        working-directory: projections
        run: node scripts/fetch-rosters.mjs

      - name: Änderungen committen, falls vorhanden
        run: |
          git config user.name "mfhfb-roster-bot"
          git config user.email "actions@users.noreply.github.com"
          git add projections/data/rosters.json projections/rosters-data.js
          if git diff --cached --quiet; then
            echo "Keine Roster-Änderungen heute."
          else
            git commit -m "Projections: Automatisches Roster-Update ($(date -u +%Y-%m-%d))"
            git push
          fi
