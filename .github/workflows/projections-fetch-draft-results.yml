name: Projections – Fetch Fantrax Draft Results

# Zieht Draft-Ergebnisse + Fantrax-ADP direkt über die League-IDs aus
# projections/data/fantrax-leagues.json (kein manueller CSV-Export mehr
# nötig), baut adp-data.js neu und committet Änderungen automatisch.
# Läuft 3x täglich (Drafts sind unregelmäßig verteilt über den Tag)
# und kann jederzeit manuell angestoßen werden.
#
# Übernommen aus dem eigenständigen MFHFBs-NBA-Projections-Repo, das
# jetzt als Unterordner projections/ in Taco Tuesday HQ lebt — Logik
# 1:1 identisch. Build-Schritte laufen mit working-directory: projections
# (damit die Skripte unverändert bleiben), der Commit-Schritt läuft vom
# Repo-Root aus mit projections/-Pfaden.

on:
  schedule:
    - cron: "0 6,14,22 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: repo-write
  cancel-in-progress: false

jobs:
  fetch-draft-results:
    runs-on: ubuntu-latest
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Draft Results + Fantrax-ADP von Fantrax ziehen
        working-directory: projections
        run: node scripts/fetch-draft-results.mjs

      - name: ADP-Daten neu bauen
        working-directory: projections
        run: python3 scripts/build-adp-data.py

      - name: Änderungen committen, falls vorhanden
        run: |
          git config user.name "mfhfb-draft-bot"
          git config user.email "actions@users.noreply.github.com"
          git add projections/data/draft-results/Fantrax-Draft-Results-AUTO-*.csv projections/data/fantrax-adp.csv projections/adp-data.js
          if git diff --cached --quiet; then
            echo "Keine Änderungen."
          else
            git commit -m "Projections: Automatisches Draft-Results/ADP-Update ($(date -u +%Y-%m-%d\ %H:%M))"
            git push
          fi
